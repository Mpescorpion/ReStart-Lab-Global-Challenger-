<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contato — ReStart Lab+</title>

  <link rel="stylesheet" href="css - estilização/reset.css" />
  <link rel="stylesheet" href="css - estilização/style_pages.css" />
  <link rel="stylesheet" href="css - estilização/components.css" />
  <link rel="stylesheet" href="css - estilização/responsividade.css" />

  <!-- estilo específico da página -->
  <link rel="stylesheet" href="css - pages adptativas/contato.css" />
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img src="images_videos - images/logo.jpg" alt="Logo ReStart Lab+" class ="logo">      </a>

      <button id="btn-menu" class="hamburger" aria-label="Abrir menu">☰</button>

      <nav id="main-nav" class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="demonstracao.html">Demonstração</a></li>
          <li><a href="faq.html">FAQ</a></li>
          <li><a href="contato.html" class="active">Contato</a></li>
          <li><a href="integrantes.html">Integrantes</a></li>
        </ul>
      </nav>
    </div>
  </header>


  <!-- ================= HERO CONTATO ================= -->
  <section class="hero-contato">
    <img src="images_videos - images/hero page_ contato.jpg" alt="Hero Contato" class="hero-img">

    <div class="hero-text">
      <h1>Fale Conosco</h1>
      <p>Estamos aqui para ajudar. Envie sua mensagem para nossa equipe!</p>
    </div>
  </section>


  <!-- ================= MAIN CONTENT ================= -->
  <main class="container">

    <section class="contact-section fade-up">

      <form class="contact-form" id="form-contato">

        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="form-group">
          <label for="assunto">Assunto</label>
          <input type="text" id="assunto" name="assunto" placeholder="Sobre o que deseja falar?" required>
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem..." required></textarea>
        </div>

        <button type="submit" class="btn-cta">Enviar mensagem</button>

      </form>

      <p id="contato-status" class="form-status"></p>
    </section>

  </main>

  <footer class="site-footer container">
    <p>© <span id="year"></span> ReStart Lab+</p>
  </footer>


  <!-- SCRIPTS -->
  <script src="js - pages_integration/menu.js"></script>
  <script src="js - pages_integration/pages_animation.js"></script>
  <script src="js - pages_integration/validation_forms.js"></script>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

    <!-- Botão Scroll to Top -->
  <button id="scrollTopBtn" class="scroll-top" aria-label="Voltar ao topo">↑</button>

</body>
</html>
